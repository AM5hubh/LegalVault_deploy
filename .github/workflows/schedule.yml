name: Scheduled Tasks

on:
  schedule:
    # Run dependency checks daily at 3 AM UTC
    - cron: '0 3 * * *'
    # Run full security audit weekly on Monday at 2 AM UTC
    - cron: '0 2 * * 1'
    # Check for stale issues/PRs every Friday
    - cron: '0 10 * * 5'
  workflow_dispatch:

jobs:
  dependency-update-check:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Check for outdated dependencies
        working-directory: ./backend
        continue-on-error: true
        run: |
          echo "## Backend Outdated Dependencies" >> $GITHUB_STEP_SUMMARY
          npm outdated >> $GITHUB_STEP_SUMMARY || echo "All dependencies are up-to-date"

      - name: Check frontend dependencies
        working-directory: ./frontend
        continue-on-error: true
        run: |
          echo "## Frontend Outdated Dependencies" >> $GITHUB_STEP_SUMMARY
          npm outdated >> $GITHUB_STEP_SUMMARY || echo "All dependencies are up-to-date"

      - name: Create issue for outdated dependencies
        uses: actions/github-script@v7
        with:
          script: |
            const title = '🔄 Scheduled Dependency Update Check';
            const body = `This is a scheduled task to check for outdated dependencies.
            
            ## Checklist
            - [ ] Review backend outdated dependencies
            - [ ] Review frontend outdated dependencies
            - [ ] Update critical security patches
            - [ ] Test after updates
            
            Check the workflow logs for details.`;
            
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['dependencies', 'maintenance']
            });
        continue-on-error: true

  repository-health-check:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check repository statistics
        run: |
          echo "## Repository Health Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### File Statistics" >> $GITHUB_STEP_SUMMARY
          echo "- Backend files: $(find backend -name '*.js' | wc -l)" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend files: $(find frontend -name '*.jsx' -o -name '*.js' | wc -l)" >> $GITHUB_STEP_SUMMARY
          echo "- Test files: $(find . -name '*.test.js' | wc -l)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Code Size" >> $GITHUB_STEP_SUMMARY
          echo "- Backend: $(find backend -name '*.js' -exec wc -l {} + | tail -1 | awk '{print $1}') lines" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend: $(find frontend -name '*.jsx' -o -name '*.js' | xargs wc -l 2>/dev/null | tail -1 | awk '{print $1}') lines" >> $GITHUB_STEP_SUMMARY

      - name: Check for long-lived branches
        run: |
          echo "### Long-lived Branches" >> $GITHUB_STEP_SUMMARY
          git for-each-ref --sort=-committerdate refs/heads/ --format='%(refname:short) - %(committerdate:short)' | head -10 >> $GITHUB_STEP_SUMMARY

  performance-baseline:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build and measure performance
        working-directory: ./frontend
        run: |
          echo "## Performance Baseline" >> $GITHUB_STEP_SUMMARY
          time npm run build 2>&1 | tee build.log >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Bundle Sizes" >> $GITHUB_STEP_SUMMARY
          du -sh dist/* >> $GITHUB_STEP_SUMMARY || echo "No dist folder"

      - name: Archive performance metrics
        uses: actions/upload-artifact@v3
        with:
          name: performance-baseline-${{ github.run_id }}
          path: frontend/dist
          retention-days: 90

  cleanup-artifacts:
    runs-on: ubuntu-latest
    
    steps:
      - name: Cleanup old artifacts
        uses: geekyeggo/delete-artifact@v2
        with:
          name: |
            backend-test-results-*
            frontend-build-*
          failOnError: false

  stale-issue-management:
    runs-on: ubuntu-latest
    
    steps:
      - name: Close stale issues
        uses: actions/stale@v8
        with:
          days-before-issue-stale: 30
          days-before-issue-close: 7
          days-before-pr-stale: 14
          days-before-pr-close: 3
          stale-issue-label: 'stale'
          stale-pr-label: 'stale'
          stale-issue-message: 'This issue has been automatically marked as stale because it has not had recent activity.'
          stale-pr-message: 'This PR has been automatically marked as stale because it has not had recent activity.'
          close-issue-message: 'This issue has been automatically closed because it was stale.'
          close-pr-message: 'This PR has been automatically closed because it was stale.'

  notification-summary:
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Send summary notification
        uses: actions/github-script@v7
        with:
          script: |
            console.log('Scheduled tasks completed');
